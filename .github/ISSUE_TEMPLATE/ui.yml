name: 🎨 UI / design
description: A UI change or new design
labels: [ui]
body:
  - type: textarea
    id: what
    attributes:
      label: What to change
      description: Which page or component (Header, course cards, calendar, popup …)
    validations:
      required: true
  - type: textarea
    id: mockup
    attributes:
      label: Mockup
      description: Drag images in here, or put them in design/mockups/ and paste the link
  - type: input
    id: files
    attributes:
      label: Files you will touch
      description: e.g. src/ui/components/Header.tsx — list them first so you don't collide with someone else's work
  - type: checkboxes
    id: base
    attributes:
      label: Before starting
      options:
        - label: I will create a ui/ branch from the latest main
          required: true
