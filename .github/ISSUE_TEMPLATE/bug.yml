name: 🐞 Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which page, which course, which platform (Brightspace / Gradescope / Pearson …)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: textarea
    id: expected
    attributes:
      label: Expected
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of Settings or in chrome://extensions, e.g. 1.5.0
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: You can attach the log exported from the diagnostics page (personal details are removed automatically)
