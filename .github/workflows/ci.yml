name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No code files in the repo root
        run: |
          stray=$(git ls-files | grep -v / | grep -E '\.(tsx?|jsx?|css)$' | grep -vE '\.config\.ts$' || true)
          if [ -n "$stray" ]; then
            echo "::error::These files are in the repository root and are not built. Move them to the matching place in src/ (see docs/team/README.md):"
            echo "$stray"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run compile

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
